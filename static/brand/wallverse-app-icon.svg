<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">WALLVERSE</title>
<desc id="desc">Minimal premium WALLVERSE icon: luminous W ribbon, glass depth and small diamond star.</desc>
<defs>
  <linearGradient id="bg" x1="70" y1="40" x2="450" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#09051A"/><stop offset=".5" stop-color="#101331"/><stop offset="1" stop-color="#030817"/></linearGradient>
  <linearGradient id="w" x1="116" y1="145" x2="407" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#FF55E6"/><stop offset=".34" stop-color="#A34BFF"/><stop offset=".68" stop-color="#477CFF"/><stop offset="1" stop-color="#32E7FF"/></linearGradient>
  <linearGradient id="shine" x1="90" y1="60" x2="420" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF" stop-opacity=".25"/><stop offset=".42" stop-color="#FFF" stop-opacity="0"/><stop offset="1" stop-color="#7CEBFF" stop-opacity=".05"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bg)"/>
<rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="url(#w)" stroke-width="3" opacity=".7" filter="url(#soft)"/>
<ellipse cx="256" cy="272" rx="190" ry="145" fill="#5C62FF" opacity=".08" filter="url(#glow)"/>
<!-- compact continuous W -->
<path d="M116 180 C143 131 181 132 202 176 L246 300 C253 320 271 323 281 302 L300 260 C306 247 320 247 326 260 L345 302 C355 323 373 320 380 300 L424 176 C445 132 483 131 510 180" fill="none" stroke="#030611" stroke-width="67" stroke-linecap="round" stroke-linejoin="round" transform="translate(-9 0)"/>
<path d="M116 180 C143 131 181 132 202 176 L246 300 C253 320 271 323 281 302 L300 260 C306 247 320 247 326 260 L345 302 C355 323 373 320 380 300 L424 176 C445 132 483 131 510 180" fill="none" stroke="url(#w)" stroke-width="49" stroke-linecap="round" stroke-linejoin="round" transform="translate(-9 0)" filter="url(#glow)"/>
<path d="M113 170 C139 132 178 134 198 173 L241 296" fill="none" stroke="#FFF" stroke-width="4.5" opacity=".48" stroke-linecap="round"/>
<path d="M331 296 L374 173 C394 134 433 132 459 170" fill="none" stroke="#FFF" stroke-width="3.5" opacity=".32" stroke-linecap="round"/>
