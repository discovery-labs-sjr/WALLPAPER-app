<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">WALLVERSE animated construction logo</title>
<desc id="desc">Three luminous ribbon strokes connect construction points to form the WALLVERSE W.</desc>
<defs>
  <linearGradient id="g" x1="150" y1="60" x2="470" y2="60" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff42e3"/><stop offset=".35" stop-color="#9a43ff"/><stop offset=".68" stop-color="#4f70ff"/><stop offset="1" stop-color="#2de8ff"/>
  </linearGradient>
  <linearGradient id="textGrad" x1="145" y1="230" x2="455" y2="230" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff39d8"/><stop offset=".32" stop-color="#a043ff"/><stop offset=".68" stop-color="#4d79ff"/><stop offset="1" stop-color="#2be5ff"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g id="constructionPoints" fill="#eaf2ff" opacity="0.0">
  <g id="points">
    <circle cx="235" cy="82" r="3"/><circle cx="285" cy="81" r="3"/><circle cx="332" cy="82" r="3"/>
    <circle cx="259" cy="181" r="3"/><circle cx="305" cy="180" r="3"/><circle cx="353" cy="183" r="3"/>
    <circle cx="379" cy="92" r="3"/><circle cx="416" cy="84" r="3"/>
  </g>
</g>

<g fill="none" stroke="#b7c7ff" stroke-width="1" opacity="0">
  <path d="M235 82 C248 109 251 144 259 181"/>
  <path d="M285 81 C294 112 298 149 305 180"/>
  <path d="M332 82 C337 115 344 149 353 183"/>
  <path d="M379 92 C371 120 363 155 353 183"/>
  <path d="M416 84 C403 113 389 153 379 181"/>
</g>

<g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.30">
  <path d="M232 79 C243 101 252 140 259 174 C264 199 280 205 293 188 C303 175 307 132 309 101" stroke-width="33"/>
  <path d="M289 82 C298 113 301 151 305 180 C309 202 324 205 338 187 C347 175 352 133 355 101" stroke-width="33"/>
  <path d="M338 81 C347 110 351 148 357 180 C361 201 376 205 390 187 C402 171 407 126 416 84" stroke-width="31"/>
</g>

<!-- thin violet construction traits: the points are connected first, then the ribbon grows over them -->
<g fill="none" stroke="#b64dff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
  <path class="trace t1" pathLength="760" d="M232 79 C243 101 252 140 259 174 C264 199 280 205 293 188 C303 175 307 132 309 101"/>
  <path class="trace t2" pathLength="760" d="M289 82 C298 113 301 151 305 180 C309 202 324 205 338 187 C347 175 352 133 355 101"/>
  <path class="trace t3" pathLength="760" d="M338 81 C347 110 351 148 357 180 C361 201 376 205 390 187 C402 171 407 126 416 84"/>
</g>

<g fill="none" stroke="url(#g)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path class="r r1" pathLength="760" d="M232 79 C243 101 252 140 259 174 C264 199 280 205 293 188 C303 175 307 132 309 101"/>
  <path class="r r2" pathLength="760" d="M289 82 C298 113 301 151 305 180 C309 202 324 205 338 187 C347 175 352 133 355 101"/>
  <path class="r r3" pathLength="760" d="M338 81 C347 110 351 148 357 180 C361 201 376 205 390 187 C402 171 407 126 416 84"/>
</g>

<g fill="none" stroke="#fff" stroke-linecap="round" opacity="0.46">
  <path d="M232 79 C243 101 252 140 259 174 C264 199 280 205 293 188" stroke-width="2.7"/>
  <path d="M289 82 C298 113 301 151 305 180 C309 202 324 205 338 187" stroke-width="2.5"/>
  <path d="M338 81 C347 110 351 148 357 180 C361 201 376 205 390 187" stroke-width="2.3"/>
</g>

<g fill="url(#g)" filter="url(#soft)">
  <circle cx="232" cy="79" r="3.2"/><circle cx="289" cy="82" r="3.1"/><circle cx="338" cy="81" r="3.0"/><circle cx="416" cy="84" r="3.2"/>
</g>

<g id="wordmark" opacity="0" fill="url(#textGrad)" font-family="Manrope,Montserrat,Poppins,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="2.5" text-anchor="middle">
  <text x="305" y="246">WALLVERSE</text>
</g>
<g id="spark" fill="url(#g)" opacity="0" filter="url(#soft)" transform="translate(495 230)">
  <path d="M0-15 C2-6 6-2 15 0 C6 2 2 6 0 15 C-2 6 -6 2 -15 0 C-6-2 -2-6 0-15Z"/>
  <circle r="2" fill="#fff"/>
</g>

<style>
#constructionPoints{animation:ptsIn .22s ease .05s forwards}
svg g[opacity="0"] > path{animation:ghostIn .32s ease .10s forwards}
.trace{stroke-dasharray:760;stroke-dashoffset:760}
.t1{animation:draw .62s cubic-bezier(.2,.78,.18,1) .18s forwards}.t2{animation:draw .62s cubic-bezier(.2,.78,.18,1) .34s forwards}.t3{animation:draw .62s cubic-bezier(.2,.78,.18,1) .48s forwards}
.r{stroke-dasharray:700;stroke-dashoffset:700}
.r1{animation:draw 1.00s cubic-bezier(.2,.78,.18,1) .25s forwards}.r2{animation:draw 1.02s cubic-bezier(.2,.78,.18,1) .48s forwards}.r3{animation:draw 1.02s cubic-bezier(.2,.78,.18,1) .71s forwards}
#wordmark{animation:wordIn .52s cubic-bezier(.16,.84,.2,1) 1.35s forwards}
#spark{animation:sparkIn .35s ease 1.72s forwards}
@keyframes ptsIn{to{opacity:.78}}
@keyframes ghostIn{to{opacity:.18}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wordIn{0%{opacity:0;transform:translateY(8px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sparkIn{0%{opacity:0;transform:translate(495px,230px) scale(.6)}100%{opacity:1;transform:translate(495px,230px) scale(1)}}
@media (prefers-reduced-motion:reduce){.trace,.r{animation:none;stroke-dashoffset:0}#constructionPoints{opacity:.78}.wordmark,#wordmark{opacity:1;animation:none}#spark{opacity:1;animation:none}}
</style>
</svg>
