<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">Animated WALLVERSE neon ribbon, orbital loop and star.</desc>
  <defs>
    <linearGradient id="wv" x1="120" y1="55" x2="510" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF45E4"/>
      <stop offset=".30" stop-color="#A94CFF"/>
      <stop offset=".58" stop-color="#6073FF"/>
      <stop offset=".83" stop-color="#25C5FF"/>
      <stop offset="1" stop-color="#48F1FF"/>
    </linearGradient>
    <linearGradient id="word" x1="145" y1="0" x2="455" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#D6D9FF"/>
      <stop offset="1" stop-color="#67E8FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-60%" width="200%" height="220%">
      <feGaussianBlur stdDeviation="6.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .trail{fill:none;stroke:#C96BFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:680;stroke-dashoffset:680;animation:draw .72s cubic-bezier(.2,.8,.15,1) .08s forwards}
      .ribbonGlow,.ribbon{fill:none;stroke:url(#wv);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:680;stroke-dashoffset:680}
      .ribbonGlow{stroke-width:45;opacity:.34;filter:url(#glow);animation:draw 1.04s cubic-bezier(.16,.84,.18,1) .52s forwards}
      .ribbon{stroke-width:29;filter:url(#glow);animation:draw 1.04s cubic-bezier(.16,.84,.18,1) .52s forwards}
      .sheen{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:170;stroke-dashoffset:170;opacity:.54;animation:draw .58s ease 1.28s forwards}
      .orbit{fill:none;stroke:url(#wv);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:430;stroke-dashoffset:430;opacity:.0;filter:url(#soft);animation:orbitIn .8s ease 1.02s forwards}
      .word{opacity:0;transform-origin:300px 247px;animation:wordIn .5s cubic-bezier(.16,.84,.2,1) 1.38s forwards}
      .star{opacity:0;transform-origin:520px 89px;animation:starIn .42s cubic-bezier(.2,.9,.2,1) 1.55s forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes orbitIn{0%{opacity:0;transform:scale(.82) rotate(-10deg)}100%{opacity:.78;transform:scale(1) rotate(0)}}
      @keyframes wordIn{0%{opacity:0;transform:translateY(7px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes starIn{0%{opacity:0;transform:scale(.2) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
      @media(prefers-reduced-motion:reduce){.trail,.ribbonGlow,.ribbon,.sheen,.orbit,.word,.star{animation:none!important;stroke-dashoffset:0}.orbit{opacity:.78}.word,.star{opacity:1;transform:none}}
    </style>
  </defs>

  <!-- Violet construction trait is drawn first. -->
  <path class="trail" d="M126 72 C152 53 180 57 196 87 L241 176 C251 199 271 205 285 183 L319 112 C325 100 335 100 341 112 L375 183 C389 205 409 199 419 176 L464 87 C480 57 508 53 534 72"/>

  <!-- One continuous, deliberately simple ribbon. -->
  <path class="ribbonGlow" d="M126 72 C152 53 180 57 196 87 L241 176 C251 199 271 205 285 183 L319 112 C325 100 335 100 341 112 L375 183 C389 205 409 199 419 176 L464 87 C480 57 508 53 534 72"/>
  <path class="ribbon" d="M126 72 C152 53 180 57 196 87 L241 176 C251 199 271 205 285 183 L319 112 C325 100 335 100 341 112 L375 183 C389 205 409 199 419 176 L464 87 C480 57 508 53 534 72"/>
  <path class="sheen" d="M132 70 C153 56 177 59 192 86 L236 173 M383 177 L421 88 C437 60 489 55 527 71"/>

  <!-- Orbit: easy to animate independently and recognizable at every size. -->
  <path class="orbit" d="M85 142 C157 76 430 72 514 128 C548 151 545 175 511 190 C429 225 167 222 91 176 C67 162 67 150 85 142Z"/>

  <g class="star" fill="url(#wv)" filter="url(#soft)">
    <path d="M520 72 C522 81 527 87 536 89 C527 91 522 97 520 106 C518 97 513 91 504 89 C513 87 518 81 520 72Z"/>
    <circle cx="520" cy="89" r="2.1" fill="#fff"/>
  </g>

  <g class="word">
    <text x="300" y="252" text-anchor="middle" fill="url(#word)" font-family="Manrope,DM Sans,Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="3">WALLVERSE</text>
  </g>
</svg>