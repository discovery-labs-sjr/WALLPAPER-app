<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">WALLVERSE</title>
<desc id="desc">Animated minimal neon WALLVERSE logo with a continuous ribbon W, orbit and star.</desc>
<defs>
  <linearGradient id="wv" x1="260" y1="130" x2="930" y2="410" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF4BE6"/><stop offset=".28" stop-color="#A946FF"/><stop offset=".55" stop-color="#566FFF"/><stop offset=".80" stop-color="#20C5FF"/><stop offset="1" stop-color="#4EF3FF"/>
  </linearGradient>
  <linearGradient id="word" x1="350" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DFE6FF"/><stop offset="1" stop-color="#8CEAFF"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .orbit{fill:none;stroke:url(#wv);stroke-width:7;stroke-linecap:round;opacity:0;stroke-dasharray:1700;stroke-dashoffset:1700;filter:url(#soft);animation:drawOrbit 1.05s cubic-bezier(.18,.8,.16,1) .75s forwards}
    .shadow{fill:none;stroke:#050812;stroke-width:62;stroke-linecap:round;stroke-linejoin:round}
    .ribbon{fill:none;stroke:url(#wv);stroke-width:46;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1250;stroke-dashoffset:1250;filter:url(#glow);animation:drawRibbon 1.55s cubic-bezier(.14,.82,.16,1) .18s forwards}
    .shine{fill:none;stroke:#fff;stroke-linecap:round;opacity:0;stroke-dasharray:430;stroke-dashoffset:430;animation:drawShine .7s ease 1.55s forwards}
    .star{opacity:0;transform-origin:949px 165px;animation:starIn .42s cubic-bezier(.18,.85,.2,1) 2.0s forwards}
    .word{opacity:0;transform:translateY(12px) scale(.97);transform-origin:600px 505px;animation:wordIn .65s cubic-bezier(.16,.84,.2,1) 1.82s forwards}
    @keyframes drawRibbon{to{stroke-dashoffset:0}}@keyframes drawOrbit{to{opacity:.80;stroke-dashoffset:0}}@keyframes drawShine{to{opacity:.48;stroke-dashoffset:0}}@keyframes wordIn{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes starIn{0%{opacity:0;transform:scale(.25) rotate(-18deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @media(prefers-reduced-motion:reduce){.orbit,.ribbon,.shine,.star,.word{animation:none!important}.orbit{opacity:.8;stroke-dashoffset:0}.ribbon,.shine{stroke-dashoffset:0}.shine{opacity:.48}.word,.star{opacity:1;transform:none}}
  </style>
</defs>

<path class="shadow" d="M290 155 C328 95 387 95 420 164 L498 340 C510 370 538 374 556 343 L586 286 C596 267 616 267 626 286 L656 343 C674 374 702 370 714 340 L792 164 C825 95 884 95 922 155"/>
<path class="ribbon" pathLength="1250" d="M290 155 C328 95 387 95 420 164 L498 340 C510 370 538 374 556 343 L586 286 C596 267 616 267 626 286 L656 343 C674 374 702 370 714 340 L792 164 C825 95 884 95 922 155"/>
<path class="shine" d="M302 147 C335 103 378 104 406 160 L483 337 M728 337 L805 160 C833 104 876 103 910 147" stroke-width="5"/>
<path class="orbit" d="M195 308 C290 198 875 184 1005 301 C1040 332 1026 362 973 379 C825 426 340 414 210 348 C174 329 170 315 195 308Z"/>
<g class="star" transform="translate(949 165)" fill="url(#wv)" filter="url(#soft)"><path d="M0-22 C3-10 10-3 22 0 C10 3 3 10 0 22 C-3 10 -10 3 -22 0 C-10-3 -3-10 0-22Z"/><circle r="3" fill="#fff"/></g>
<g class="word"><text x="600" y="505" text-anchor="middle" fill="url(#word)" font-family="Manrope,DM Sans,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="7">WALLVERSE</text></g>
</svg>