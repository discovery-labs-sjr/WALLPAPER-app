<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">WALLVERSE</title>
<desc id="desc">Minimal futuristic WALLVERSE mark: one continuous neon ribbon W, orbital ring, star and wordmark.</desc>
<defs>
  <linearGradient id="wv" x1="260" y1="130" x2="930" y2="410" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF4BE6"/><stop offset=".28" stop-color="#A946FF"/><stop offset=".55" stop-color="#566FFF"/><stop offset=".80" stop-color="#20C5FF"/><stop offset="1" stop-color="#4EF3FF"/>
  </linearGradient>
  <linearGradient id="word" x1="350" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DFE6FF"/><stop offset="1" stop-color="#8CEAFF"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- single continuous W ribbon -->
<path d="M290 155 C328 95 387 95 420 164 L498 340 C510 370 538 374 556 343 L586 286 C596 267 616 267 626 286 L656 343 C674 374 702 370 714 340 L792 164 C825 95 884 95 922 155"
      fill="none" stroke="#060A16" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M290 155 C328 95 387 95 420 164 L498 340 C510 370 538 374 556 343 L586 286 C596 267 616 267 626 286 L656 343 C674 374 702 370 714 340 L792 164 C825 95 884 95 922 155"
      fill="none" stroke="url(#wv)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M302 147 C335 103 378 104 406 160 L483 337" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".55"/>
<path d="M728 337 L805 160 C833 104 876 103 910 147" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".38"/>

<!-- orbit -->
<path d="M195 308 C290 198 875 184 1005 301 C1040 332 1026 362 973 379 C825 426 340 414 210 348 C174 329 170 315 195 308Z"
      fill="none" stroke="url(#wv)" stroke-width="7" stroke-linecap="round" opacity=".80" filter="url(#soft)"/>

<!-- star -->
<g transform="translate(949 165)" fill="url(#wv)" filter="url(#soft)">
  <path d="M0-22 C3-10 10-3 22 0 C10 3 3 10 0 22 C-3 10 -10 3 -22 0 C-10-3 -3-10 0-22Z"/>
  <circle r="3" fill="#FFFFFF"/>
</g>

<text x="600" y="505" text-anchor="middle" fill="url(#word)" font-family="Manrope,DM Sans,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="7">WALLVERSE</text>
</svg>