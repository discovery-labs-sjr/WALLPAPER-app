    <path d="M166 62 C181 51 202 53 211 67 C220 82 225 112 238 151 C244 169 257 171 268 151 C282 126 285 83 303 65 C315 53 337 52 349 64 C363 78 369 111 382 151 C388 169 401 171 413 151 C426 130 432 89 449 63"/>
    <path d="M214 67 C228 82 239 111 251 145 C258 163 271 166 282 148 C296 125 301 91 303 65 C305 82 313 111 326 145 C333 163 346 166 357 148 C371 125 377 92 382 151"/>
  </g>

  <text x="54" y="226" fill="url(#g)" font-family="Arial Black,Montserrat,Poppins,sans-serif" font-size="52" font-weight="900" letter-spacing="-2.2">WALLVERSE</text>
  <g transform="translate(424 211) scale(.22)" filter="url(#sg)"><path d="M0-34C3-12 12-3 34 0 12 3 3 12 0 34-3 12-12 3-34 0-12-3-3-12 0-34Z" fill="url(#g)"/></g>
