<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">WALLVERSE</title>
<desc id="desc">WALLVERSE premium monogram in cool silver and electric violet-blue, with the W formed by three simple overlapping V strokes.</desc>
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFF"/>
    <stop offset=".28" stop-color="#AAB8D3"/>
    <stop offset=".55" stop-color="#5E6D88"/>
    <stop offset=".78" stop-color="#D8E2F4"/>
    <stop offset="1" stop-color="#7E8CA7"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A98BFF"/>
    <stop offset=".42" stop-color="#6C63FF"/>
    <stop offset=".72" stop-color="#3D9CFF"/>
    <stop offset="1" stop-color="#64E7FF"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D9E2F2"/>
    <stop offset=".65" stop-color="#F5F8FF"/>
    <stop offset="1" stop-color="#AFC5E7"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#00030B" flood-opacity=".55"/>
  </filter>
</defs>

<!-- Clean monogram inspired by the supplied reference: no complex ribbon. -->
<g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M188 130 L338 386 L488 130" stroke="#070B16" stroke-width="104"/>
  <path d="M188 130 L338 386 L488 130" stroke="url(#silver)" stroke-width="86"/>

  <path d="M414 130 L560 386 L718 130" stroke="#070B16" stroke-width="104"/>
  <path d="M414 130 L560 386 L718 130" stroke="url(#accent)" stroke-width="86"/>

  <path d="M642 130 L792 386 L948 130" stroke="#070B16" stroke-width="104"/>
  <path d="M642 130 L792 386 L948 130" stroke="url(#silver)" stroke-width="86"/>

  <path d="M188 130 L338 386 L488 130" stroke="#FFFFFF" stroke-width="4" opacity=".28"/>
  <path d="M414 130 L560 386 L718 130" stroke="#E8E8FF" stroke-width="4" opacity=".28"/>
  <path d="M642 130 L792 386 L948 130" stroke="#FFFFFF" stroke-width="4" opacity=".24"/>
</g>

<!-- Wordmark -->
<g font-family="Manrope,DM Sans,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="12">
  <text x="600" y="488" text-anchor="middle" fill="url(#word)">W</text>
  <text x="679" y="488" text-anchor="middle" fill="url(#accent)">A</text>
  <text x="760" y="488" text-anchor="middle" fill="url(#word)">LLVERSE</text>
</g>
</svg>
