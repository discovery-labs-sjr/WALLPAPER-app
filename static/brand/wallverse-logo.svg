<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">WALLVERSE logo with a continuous ribbon-shaped W, gradient wordmark and compact four-point sparkle.</desc>
  <defs>
    <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff38df"/>
      <stop offset="0.30" stop-color="#7547ff"/>
      <stop offset="0.62" stop-color="#477cff"/>
      <stop offset="1" stop-color="#35e6ff"/>
    </linearGradient>
    <filter id="wglow" x="-30%" y="-40%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="smallglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- One continuous ribbon path: three raised tips and two deep rounded valleys. -->
  <path d="M150 58 C166 82 175 143 196 151 C218 159 224 86 246 64 C262 48 278 143 301 151 C324 159 335 84 366 58"
        fill="none" stroke="url(#wv)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#wglow)" opacity="0.75"/>
  <path d="M150 58 C166 82 175 143 196 151 C218 159 224 86 246 64 C262 48 278 143 301 151 C324 159 335 84 366 58"
        fill="none" stroke="url(#wv)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wide geometric wordmark, kept as one centered block. -->
  <text x="73" y="238" fill="url(#wv)"
        font-family="Montserrat, Poppins, Arial, Helvetica, sans-serif"
        font-size="63" font-weight="800" letter-spacing="-1.5">WALLVERSE</text>

  <!-- Small sparkle immediately after the E. -->
  <g transform="translate(457 221) scale(.28)" filter="url(#smallglow)">
    <path d="M0 -30 C3 -10 10 -3 30 0 C10 3 3 10 0 30 C-3 10 -10 3 -30 0 C-10 -3 -3 -10 0 -30Z" fill="url(#wv)"/>
  </g>
</svg>