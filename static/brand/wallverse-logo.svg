<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">WALLVERSE logo with an intertwined glossy neon ribbon W, wordmark and four-point sparkle.</desc>
  <defs>
    <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25E8FF"/>
      <stop offset="0.28" stop-color="#148CFF"/>
      <stop offset="0.55" stop-color="#6848FF"/>
      <stop offset="0.78" stop-color="#C43CFF"/>
      <stop offset="1" stop-color="#FF35E5"/>
    </linearGradient>
    <linearGradient id="wv2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00DFFF"/>
      <stop offset="0.5" stop-color="#5D48FF"/>
      <stop offset="1" stop-color="#FF2EDC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset=".25" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".38"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-45%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- New ribbon W: two overlapping trajectories create the intertwined construction. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- rear ribbon -->
    <path d="M112 56 C137 45 158 49 174 72 C193 100 201 143 216 178 C227 205 249 208 266 181 C282 156 289 104 307 72 C322 46 347 44 369 57 C390 70 399 104 414 145 C424 173 440 177 456 151 C469 130 478 92 490 62" stroke="url(#wv2)" stroke-width="31"/>
    <!-- front ribbon -->
    <path d="M126 63 C150 77 163 104 176 139 C188 172 199 205 221 213 C243 221 261 202 275 177 C290 150 301 102 315 76 C329 51 350 47 372 58 C393 69 405 100 417 136 C430 175 445 199 468 187 C486 178 497 145 506 112" stroke="url(#wv)" stroke-width="31"/>
  </g>

  <!-- crisp ribbon cores -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 56 C137 45 158 49 174 72 C193 100 201 143 216 178 C227 205 249 208 266 181 C282 156 289 104 307 72 C322 46 347 44 369 57 C390 70 399 104 414 145 C424 173 440 177 456 151 C469 130 478 92 490 62" stroke="url(#wv2)" stroke-width="19"/>
    <path d="M126 63 C150 77 163 104 176 139 C188 172 199 205 221 213 C243 221 261 202 275 177 C290 150 301 102 315 76 C329 51 350 47 372 58 C393 69 405 100 417 136 C430 175 445 199 468 187 C486 178 497 145 506 112" stroke="url(#wv)" stroke-width="19"/>
  </g>

  <!-- subtle glossy highlights -->
  <path d="M112 56 C137 45 158 49 174 72 C193 100 201 143 216 178 C227 205 249 208 266 181" fill="none" stroke="url(#shine)" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <path d="M315 76 C329 51 350 47 372 58 C393 69 405 100 417 136" fill="none" stroke="url(#shine)" stroke-width="4" stroke-linecap="round" opacity=".65"/>

  <!-- centered wordmark below the W -->
  <text x="300" y="252" text-anchor="middle" fill="url(#wv)" font-family="Manrope,Montserrat,Poppins,Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="3.2">WALLVERSE</text>

  <!-- compact four-point sparkle immediately after the E -->
  <g transform="translate(545 239)" filter="url(#smallGlow)">
    <path d="M0-18 C2-7 7-2 18 0 C7 2 2 7 0 18 C-2 7 -7 2 -18 0 C-7-2 -2-7 0-18Z" fill="url(#wv)"/>
    <path d="M0-11 C1-4 4-1 11 0 C4 1 1 4 0 11 C-1 4 -4 1 -11 0 C-4-1 -1-4 0-11Z" fill="#FFFFFF" opacity=".18"/>
  </g>
</svg>
