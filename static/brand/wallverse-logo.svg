<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">Clean premium WALLVERSE logo with a smooth neon ribbon W, futuristic wordmark and compact sparkle.</desc>
  <defs>
    <linearGradient id="wv" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="480" y2="0">
      <stop offset="0" stop-color="#FF32D8"/>
      <stop offset=".30" stop-color="#9B3CFF"/>
      <stop offset=".58" stop-color="#496CFF"/>
      <stop offset=".82" stop-color="#1AAEFF"/>
      <stop offset="1" stop-color="#28E8FF"/>
    </linearGradient>
    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="145" y1="230" x2="455" y2="230">
      <stop offset="0" stop-color="#FF39D8"/>
      <stop offset=".32" stop-color="#A043FF"/>
      <stop offset=".68" stop-color="#4D79FF"/>
      <stop offset="1" stop-color="#2BE5FF"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-45%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Premium W: one deliberate, symmetric ribbon trajectory. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- atmospheric glow -->
    <path d="M125 67
             C151 52 175 55 190 76
             C207 100 215 144 229 180
             C241 210 262 215 280 192
             C292 177 296 143 300 108
             C304 143 308 177 320 192
             C338 215 359 210 371 180
             C385 144 393 100 410 76
             C425 55 449 52 475 67"
          stroke="url(#wv)" stroke-width="48" opacity=".42" filter="url(#glow)"/>

    <!-- main capsule ribbon -->
    <path d="M125 67
             C151 52 175 55 190 76
             C207 100 215 144 229 180
             C241 210 262 215 280 192
             C292 177 296 143 300 108
             C304 143 308 177 320 192
             C338 215 359 210 371 180
             C385 144 393 100 410 76
             C425 55 449 52 475 67"
          stroke="url(#wv)" stroke-width="29"/>

    <!-- glossy inner highlight -->
    <path d="M125 67
             C151 52 175 55 190 76
             C207 100 215 144 229 180
             C241 210 262 215 280 192"
          stroke="#FFFFFF" stroke-width="4" opacity=".55"/>
    <path d="M300 108 C304 143 308 177 320 192 C338 215 359 210 371 180"
          stroke="#FFFFFF" stroke-width="3.5" opacity=".38"/>
    <path d="M410 76 C425 55 449 52 475 67"
          stroke="#FFFFFF" stroke-width="4" opacity=".45"/>
  </g>

  <!-- Small luminous terminal accents emphasize the capsule ends. -->
  <g fill="url(#wv)" filter="url(#softGlow)">
    <circle cx="125" cy="67" r="3.5"/>
    <circle cx="475" cy="67" r="3.5"/>
  </g>

  <!-- WALLVERSE: restrained futuristic wordmark. -->
  <text x="292" y="253" text-anchor="middle" fill="url(#textGrad)"
        font-family="Montserrat,Manrope,Poppins,Arial,sans-serif"
        font-size="41" font-weight="800" letter-spacing="2.8">WALLVERSE</text>

  <!-- Compact four-point sparkle, kept close to the final E. -->
  <g transform="translate(531 238)" fill="url(#wv)" filter="url(#softGlow)">
    <path d="M0-17 C2-7 7-2 17 0 C7 2 2 7 0 17 C-2 7 -7 2 -17 0 C-7-2 -2-7 0-17Z"/>
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
