<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">WALLVERSE logo with a smooth compact W, gradient wordmark and small four-point sparkle.</desc>
  <defs>
    <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff38df"/>
      <stop offset="0.30" stop-color="#7845ff"/>
      <stop offset="0.64" stop-color="#4779ff"/>
      <stop offset="1" stop-color="#35e6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Smooth, compact W: one continuous ribbon-like stroke with rounded ends. -->
  <path d="M190 58
           C195 45 209 44 215 59
           L240 134
           C245 149 260 154 269 143
           C273 138 276 131 279 121
           L291 88
           C296 74 309 74 314 88
           L326 121
           C329 131 332 138 336 143
           C345 154 360 149 365 134
           L390 59
           C396 44 410 45 415 58"
        fill="none" stroke="url(#wv)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Wordmark sized and positioned as a single centered block. -->
  <text x="108" y="225" fill="url(#wv)"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="53" font-weight="900" letter-spacing="-2.8">WALLVERSE</text>

  <!-- Small sparkle placed immediately after the E. -->
  <g transform="translate(494 207) scale(.36)" filter="url(#glow)">
    <path d="M0 -27 C3 -9 9 -3 27 0 C9 3 3 9 0 27 C-3 9 -9 3 -27 0 C-9 -3 -3 -9 0 -27Z" fill="url(#wv)"/>
  </g>
</svg>