      <stop offset="0" stop-color="#ff35df"/>
      <stop offset="0.34" stop-color="#8248ff"/>
      <stop offset="0.68" stop-color="#3986ff"/>
      <stop offset="1" stop-color="#35e8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-60%" width="200%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Prototype W: two intertwined ribbon trajectories, following the construction visible in the reference frames. -->
  <g fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
