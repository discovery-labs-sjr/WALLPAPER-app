<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">WALLVERSE logo prototype based on the observed neon ribbon construction: two intertwined smooth trajectories, gradient wordmark and compact sparkle.</desc>
