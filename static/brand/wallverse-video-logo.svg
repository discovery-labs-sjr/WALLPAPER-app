<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" role="img" aria-labelledby="title desc">
  <title id="title">WALLVERSE</title>
  <desc id="desc">WALLVERSE logo with four rounded capsule strokes forming the W, a gradient wordmark and four-point star.</desc>
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="145" y1="0" x2="430" y2="0">
      <stop offset="0" stop-color="#ff55df"/>
      <stop offset="0.34" stop-color="#7442ff"/>
      <stop offset="0.66" stop-color="#478dff"/>
      <stop offset="1" stop-color="#39e6ff"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The W is intentionally built from four thick rounded capsule strokes. -->
  <g fill="none" stroke="url(#grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M158 52 L202 164"/>
    <path d="M202 164 L252 52"/>
    <path d="M252 52 L302 164"/>
    <path d="M302 164 L356 52"/>
  </g>

  <!-- very soft highlight, keeping the capsule edges luminous without flattening them -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".11" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 52 L202 164"/>
    <path d="M202 164 L252 52"/>
    <path d="M252 52 L302 164"/>
    <path d="M302 164 L356 52"/>
  </g>

  <text x="48" y="229" fill="url(#grad)" font-family="Manrope, DM Sans, Arial, sans-serif" font-size="55" font-weight="800" letter-spacing="0.4">WALLVERSE</text>

  <!-- signature star -->
  <path d="M548 195 L558 211 L574 220 L558 229 L548 246 L538 229 L522 220 L538 211 Z"
        fill="url(#grad)" filter="url(#glow)"/>
</svg>
