services:
  - type: web
    name: wallverse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WALLPAPER_MIN_LONG_SIDE
        value: "2000"
      - key: WALLPAPER_MIN_SHORT_SIDE
        value: "1080"

databases:
  - name: wallverse-db
    plan: free
