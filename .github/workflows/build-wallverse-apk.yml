name: Build WALLVERSE Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-wallverse-apk.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public HTTPS URL of the WALLVERSE website"
        required: true
        type: string
        default: "https://wallpaper-app-bw12.onrender.com/"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Select WALLVERSE base URL
        id: config
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BASE_URL="${{ inputs.base_url }}"
          else
            BASE_URL="https://wallpaper-app-bw12.onrender.com/"
          fi
          if [[ ! "$BASE_URL" =~ ^https:// ]]; then
            echo "WALLVERSE_BASE_URL must use HTTPS."
            exit 1
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon -PWALLVERSE_BASE_URL="${{ steps.config.outputs.base_url }}"

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "Release APK generated: $APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WALLVERSE-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.1.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --title "WALLVERSE Android $TAG" \
            --notes "WALLVERSE Android release build. Website: ${{ steps.config.outputs.base_url }}"
