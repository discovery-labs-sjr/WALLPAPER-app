name: Build WALLVERSE Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-wallverse-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          echo "Unsigned release APK generated: $APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WALLVERSE-Android-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.1.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --title "WALLVERSE Android $TAG" \
            --notes "WALLVERSE Android release build (unsigned). Website: https://wallpaper-app-bw12.onrender.com/"
