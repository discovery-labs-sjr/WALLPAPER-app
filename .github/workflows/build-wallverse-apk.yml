name: Build WALLVERSE APK
# AndroidX is enabled in android/gradle.properties

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-wallverse-apk.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public HTTPS URL of the WALLVERSE website"
        required: true
        type: string
        default: "https://wallpaper-app-bw12.onrender.com/"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select WALLVERSE base URL
        id: config
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BASE_URL="${{ inputs.base_url }}"
          else
            BASE_URL="https://wallpaper-app-bw12.onrender.com/"
          fi
          if [[ ! "$BASE_URL" =~ ^https:// ]]; then
            echo "WALLVERSE_BASE_URL must use HTTPS."
            exit 1
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon -PWALLVERSE_BASE_URL="${{ steps.config.outputs.base_url }}"

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WALLVERSE.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WALLVERSE-APK
          path: WALLVERSE.apk

      - name: Publish downloadable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" WALLVERSE.apk             --title "WALLVERSE Android $TAG"             --notes "WALLVERSE Android build. Website: ${{ steps.config.outputs.base_url }}"             --latest
